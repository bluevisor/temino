<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Temino Remote</title>
<style>
  :root {
    --bg: #111317; --panel: #1a1d23; --raised: #22262e; --line: #2c313a;
    --text: #e6e8ec; --dim: #9aa1ad; --faint: #6b7280; --accent: #67b0e8;
    --waiting: #f0a35e; --done: #8ccf7e; --error: #e06c75; --string: #98c379; --variable: #c678dd; --cursor: #e6e8ec;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; width: 100%; overflow: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  #crumbs { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  #crumbs b { color: var(--text); font-weight: 600; }
  button { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; }
  button:active { background: var(--line); }
  header, main, footer { min-width: 0; }
  main { flex: 1; overflow: auto; padding: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.running { background: var(--accent); } .dot.waiting { background: var(--waiting); }
  .dot.done { background: var(--done); } .dot.none { visibility: hidden; }
  .card { display: flex; align-items: center; gap: 10px; padding: 12px; margin-bottom: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .card .t { flex: 1; min-width: 0; }
  .card .t div:first-child { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .t div + div { color: var(--faint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.current { border-color: var(--accent); }
  .swatch { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  pre { margin: 0; font: 11px ui-monospace, Menlo, monospace; line-height: 1.25; white-space: pre; }
  #screen { --fs: 12px; overflow-x: auto; min-height: 100%; cursor: text; }
  #screen pre, #screen .cmd { font-size: var(--fs); }
  #screen.full { background: var(--bg); }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; overflow-x: auto; }
  .block.failed { border-color: color-mix(in srgb, var(--error) 55%, var(--line)); }
  .block.running { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .block .term { margin-top: 6px; }
  .bh { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 4px; }
  .chip { color: var(--dim); background: var(--raised); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  .chip.br { color: var(--variable); }
  .st { margin-left: auto; white-space: nowrap; color: var(--faint); }
  .st.ok { color: var(--done); } .st.bad { color: var(--error); } .st.run { color: var(--accent); }
  .cmd { font: 13px ui-monospace, Menlo, monospace; white-space: pre; color: var(--text); }
  .pr { color: var(--accent); }
  .prompt { background: var(--raised); }
  .prompt .chip { background: var(--panel); }
  .hint { color: var(--faint); }
  .ghost { color: var(--faint); }
  .prompt.ai { border-color: color-mix(in srgb, var(--variable) 50%, var(--line)); }
  .prompt.ai .pr, .chip.ai { color: var(--variable); }
  .menu { margin-top: 6px; max-height: 40vh; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 4px; }
  .mi { display: flex; align-items: center; gap: 8px; padding: 7px 6px; border-radius: 6px; font: 13px ui-monospace, Menlo, monospace; white-space: nowrap; }
  .mi.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .mi .k { width: 7px; height: 7px; border-radius: 2px; background: var(--faint); flex: none; }
  .mi .k.command { background: var(--accent); } .mi .k.directory { background: var(--variable); }
  .mi .k.file { background: var(--string); } .mi .k.history { background: var(--waiting); }
  .cur { background: var(--cursor); color: var(--bg); border-radius: 1px; }
  body:not(.typing) .prompt .cur { background: transparent; outline: 1px solid var(--cursor); color: inherit; }
  .wait { color: var(--faint); padding: 12px; }
  .mini .m { height: calc(100% - 22px); overflow: hidden; --fs: 6px; }
  .mini .block { padding: 4px 6px; margin-bottom: 4px; border-radius: 6px; }
  .mini .bh { display: none; }
  .mini pre, .mini .cmd { font-size: 6px; }
  #type { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; border: 0; padding: 0; resize: none; }
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .mini { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px; height: 160px; overflow: hidden; }
  .mini .h { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; }
  .mini pre { font-size: 6px; }
  footer { padding: 8px 8px 10px; background: var(--panel); border-top: 1px solid var(--line); }
  #keys { display: flex; gap: 6px; overflow-x: auto; }
  #keys button { flex: none; padding: 6px 12px; }
  #status { color: var(--faint); font-size: 13px; text-align: center; padding: 24px; }
  .user { color: var(--faint); font-size: 13px; padding: 4px 2px 12px; }
  .center { max-width: 360px; margin: 12vh auto 0; text-align: center; }
  .center h1 { font-size: 20px; margin: 0 0 8px; }
  .center p { color: var(--dim); line-height: 1.45; margin: 0 0 20px; }
  .code { font: 600 40px ui-monospace, Menlo, monospace; letter-spacing: 6px; margin: 8px 0 18px; }
  .signout { text-align: center; margin: 24px 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .note { color: var(--faint); font-size: 13px; text-align: center; max-width: 360px; margin: 0 auto; line-height: 1.4; }
  .center button { width: 100%; padding: 12px; font-weight: 600; }
  .lock { color: var(--done); font-size: 12px; }
  #side { display: none; }
  #alerts { position: fixed; left: 8px; right: 8px; top: calc(env(safe-area-inset-top) + 56px); z-index: 10; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .alert { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
    background: var(--raised); border: 1px solid var(--line); box-shadow: 0 8px 30px rgb(0 0 0 / 0.35); max-width: 520px; margin: 0 auto; width: 100%; }
  .alert.waiting { border-color: color-mix(in srgb, var(--waiting) 60%, var(--line)); }
  .alert.done { border-color: color-mix(in srgb, var(--done) 60%, var(--line)); }
  .alert .t { flex: 1; min-width: 0; font-size: 14px; }
  .alert .t div + div { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .alert button { padding: 6px 10px; font-size: 13px; }
  .alert .yes { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  #tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  #tabs[hidden] { display: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 6px; flex: none; max-width: 46vw; padding: 6px 10px; border-radius: 8px;
    background: var(--raised); color: var(--dim); font-size: 13px; border: 1px solid transparent; position: relative; overflow: hidden; }
  .tab.current { color: var(--text); border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); background: color-mix(in srgb, var(--raised) 70%, var(--text) 6%); }
  .tab .n { color: var(--faint); }
  .tab .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .tab .x { color: var(--faint); padding: 0 0 0 4px; }
  .tab.add { color: var(--accent); }
  /* iPad and other wide screens: the pane keeps a list of the window's
     tabs and panes beside it, and the zoomed-out views spread wider. */
  @media (min-width: 768px) {
    body { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr auto; }
    header { grid-column: 1 / -1; }
    #tabs { display: none !important; }
    #side .add { margin-right: 12px; width: calc(100% - 12px); }
    #side { display: block; grid-row: 2 / 4; overflow: auto; padding: 12px 0 12px 12px; border-right: 1px solid var(--line); }
    body.wide-off #side { display: none; }
    body.wide-off main, body.wide-off footer { grid-column: 1 / -1; }
    #side .card { padding: 9px 10px; margin-bottom: 6px; margin-right: 12px; }
    #side .pane { margin-left: 18px; font-size: 13px; }
    main { padding: 16px; }
    pre { font-size: 13px; }
    .mini pre, .mini .cmd { font-size: 8px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .mini { height: 260px; }
    .mini pre { font-size: 8px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 12px; }
    footer { padding: 10px 16px 14px; }
  }
</style>
</head>
<body>
<header>
  <button id="out" aria-label="Zoom out">⤢</button>
  <div id="crumbs">Temino</div>
  <span class="lock" id="lock" hidden title="End-to-end encrypted">● E2E</span>
</header>
<div id="alerts"></div>
<nav id="tabs" hidden></nav>
<nav id="side"></nav>
<main id="main"><div id="status">Loading…</div></main>
<footer id="footer" hidden>
  <div id="keys"></div>
  <textarea id="type" rows="1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type into the terminal"></textarea>
</footer>
<script type="module" src="/app.js"></script>
</body>
</html>
