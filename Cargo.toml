[package]
name = "temino"
version = "0.2.8"
edition = "2021"
description = "An ADHD-friendly, GPU-accelerated modern terminal, designed for the AI age (Haiku, Linux and macOS)"
license = "MIT"
repository = "https://github.com/bluevisor/temino"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
fontdue = "0.9.5"
# Haiku ships its CJK fonts as CFF2 variable fonts; fontdue only reads
# their outlines with this feature on.
ttf-parser = { version = "0.25", default-features = false, features = ["variable-fonts"] }
unicode-width = "0.2"
# Shaping for the mono font's ligatures (its `calt` feature).
rustybuzz = "0.20"
# Inline images (iTerm2 and Kitty protocols).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# Remote control: the WebSocket a phone (or the test page) connects over.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# End-to-end encryption between a remote and this machine (Noise XX).
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }

[target.'cfg(not(target_os = "haiku"))'.dependencies]
# The relay is reached over TLS (wss://). Not on Haiku yet: rustls's ring
# isn't known to build there.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
libc = "0.2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
debug = "line-tables-only"

# CFF2 glyphs come out filled solid without bluevisor/ttf-parser@0d3fe68
# (the last contour is never closed upstream).
[patch.crates-io]
ttf-parser = { git = "https://github.com/bluevisor/ttf-parser", rev = "0d3fe68aa270b5eba1d816123e4d07b6a57d0152" }
